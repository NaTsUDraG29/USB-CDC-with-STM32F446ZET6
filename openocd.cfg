# ============================================================================
# OpenOCD configuration for BTT Octopus (STM32F446ZET6) + ST-Link
# ============================================================================

# Debug probe: ST-Link (V2, V2-1, V3) via CMSIS-DAP/DAP-direct SWD
source [find interface/stlink-dap.cfg]
transport select dapdirect_swd

# Target MCU: STM32F4 series
source [find target/stm32f4x.cfg]

# Clock speed: 2000 kHz (safe and fast for SWD wires)
adapter speed 2000

# Reset configuration:
# 'none' allows debugging without needing the hardware NRST pin connected,
# relying on ARM Cortex-M software reset (SYSRESETREQ).
reset_config none
